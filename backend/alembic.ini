# Alembic config
[alembic]
script_location = alembic
version_path = alembic/versions
prepend_sys_path = .
# sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/poultry_disease

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname =

[logger_alembic]
level = INFO
handlers = console
qualname =